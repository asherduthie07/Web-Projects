<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice</title>
</head>
<body>
    <button onclick="diceRoller()"> Click to roll the dice!</button>
    <script>
        const diceRoller = function (){
            let dice = Math.trunc(Math.random() * 6) + 1;
            document.write(dice);
        }
    </script>
</body>
</html>
